plugins {
    id 'net.fabricmc.fabric-loom' version "${loom_version}"
}

def gitCommit = providers.exec {
    commandLine("git", "rev-parse", "--short=7", "HEAD")
}.standardOutput.asText.get().trim()

def gitDirty = !providers.exec {
    commandLine("git", "status", "--porcelain")
}.standardOutput.asText.get().trim().isEmpty()

version = "${project.minecraft_version}-${project.mod_version}"
if (project.include_git_commit.toBoolean()) {
    def commit = null
    try {
        def result = providers.exec {
            commandLine("git", "rev-parse", "--short=7", "HEAD")
            ignoreExitValue = true
        }
        def out = result.standardOutput.asText.get().trim()
        def err = result.standardError.asText.get().trim()
        if (result.result.get().exitValue != 0 || !out) {
            throw new GradleException(
                "include_git_commit=true 但获取 git commit 失败\n" +
                "可能原因：当前目录不是 git 仓库、HEAD 不存在、或 git 未安装\n" +
                "不需要这个功能可在gradle.properties将include_git_commit设为false解决\n" +
                "git stderr: ${err ?: '(empty)'}"
            )
        }
        commit = out
    } catch (GradleException e) {
        throw e
    } catch (Exception e) {
        throw new GradleException(
            "include_git_commit=true 但无法执行 git 命令，请确认 git 已安装并在 PATH 中。\n" +
            "不需要这个功能可在gradle.properties将include_git_commit设为false解决\n" +
            "原始错误: ${e.message}",
            e
        )
    }
    version += "+${commit}"
}

group = project.maven_group

base {
    archivesName = project.archives_base_name
}

loom {
    splitEnvironmentSourceSets()
    mods {
        tsf {
            sourceSet sourceSets.main
            sourceSet sourceSets.client
        }
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
    implementation include("net.kyori:adventure-text-minimessage:${project.adventure_version}")
    implementation include("net.kyori:adventure-text-serializer-gson:${project.adventure_version}")
    include "net.kyori:adventure-api:${project.adventure_version}"
    include "net.kyori:adventure-key:${project.adventure_version}"
    include "net.kyori:adventure-text-serializer-json:${project.adventure_version}"
    include "net.kyori:adventure-text-serializer-commons:${project.adventure_version}"
    include "net.kyori:option:${project.adventure_option_version}"
    compileOnly "com.terraformersmc:modmenu:21.0.0"
    implementation include("org.yaml:snakeyaml:${project.snakeyaml_version}")
    implementation include("org.postgresql:postgresql:${project.postgresql_version}")
    implementation include("org.mariadb.jdbc:mariadb-java-client:${project.mariadb_version}")
}

repositories {
    mavenCentral()
    maven { url 'https://maven.terraformersmc.com/releases/' }
}

processResources {
    inputs.property 'version', project.version
    filesMatching('fabric.mod.json') {
        expand 'version': project.version
    }
}

tasks.withType(JavaCompile).configureEach {
    options.release = 25
    options.encoding = 'UTF-8'
}

java {
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
    withSourcesJar()
}

tasks.register('texturePack', Zip) {
    from 'resourcepacks/TSF-Textures'
    archiveFileName = 'tsf-textures-26.3.zip'
    destinationDirectory = layout.buildDirectory.dir('libs')
}
