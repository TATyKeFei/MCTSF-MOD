plugins {
    id 'net.fabricmc.fabric-loom' version "${loom_version}"
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

loom {
    splitEnvironmentSourceSets()
    mods {
        tsf {
            sourceSet sourceSets.main
            sourceSet sourceSets.client
        }
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
    implementation include("net.kyori:adventure-text-minimessage:${project.adventure_version}")
    implementation include("net.kyori:adventure-text-serializer-gson:${project.adventure_version}")
    include "net.kyori:adventure-api:${project.adventure_version}"
    include "net.kyori:adventure-key:${project.adventure_version}"
    include "net.kyori:adventure-text-serializer-json:${project.adventure_version}"
    include "net.kyori:adventure-text-serializer-commons:${project.adventure_version}"
    include "net.kyori:option:${project.adventure_option_version}"
    compileOnly "com.terraformersmc:modmenu:21.0.0"
    implementation include("org.yaml:snakeyaml:${project.snakeyaml_version}")
    implementation include("org.postgresql:postgresql:${project.postgresql_version}")
    implementation include("org.mariadb.jdbc:mariadb-java-client:${project.mariadb_version}")
}

repositories {
    mavenCentral()
    maven { url 'https://maven.terraformersmc.com/releases/' }
}

processResources {
    inputs.property 'version', project.version
    filesMatching('fabric.mod.json') {
        expand 'version': project.version
    }
}

tasks.withType(JavaCompile).configureEach {
    options.release = 25
    options.encoding = 'UTF-8'
}

java {
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
    withSourcesJar()
}

tasks.register('texturePack', Zip) {
    from 'resourcepacks/TSF-Textures'
    archiveFileName = 'tsf-textures-26.3.zip'
    destinationDirectory = layout.buildDirectory.dir('libs')
}

